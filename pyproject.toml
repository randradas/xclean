[project]
name = "xclean"
version = "0.1.0"
description = "Bulk-remove your own X content and activity, chosen by rules you set, with a preview first."
readme = "README.md"
authors = [
    { name = "Roberto Andradas Izquierdo", email = "865380+randradas@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
xclean = "xclean.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# xclient.py left out: its mutants crash the forked runner on macOS (mutmut 3.8.1).
source_paths = ["src/xclean/engine.py", "src/xclean/store.py"]
also_copy = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
